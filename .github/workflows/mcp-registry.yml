name: MCP Registry

# Publishes server.json to the official MCP Registry.
#
# Primary identity: app.uteke/uteke-memory — domain-verified via a TXT record
# on _mcp.uteke.app (v=MCPv1; k=ed25519; p=<hex>), published with
# `mcp-publisher login dns` using MCP_DNS_PRIVATE_KEY_HEX (repo secret).
#
# Legacy identity: io.github.codecoradev/uteke — namespace tied to GitHub OIDC.
# Kept for the deprecation flow: flip its status to deleted AFTER the new
# domain-namespace listing is live (mcp-registry-deprecate.yml, workflow_dispatch).
#
# server.json's version must match the release tag (workflow_dispatch exempt).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  MCP_PUBLISHER_VERSION: "1.8.8"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check server.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(jq -r .version server.json)"
          if [ "$want" != "$got" ]; then
            echo "server.json version $got does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep ' mcp-publisher_linux_amd64.tar.gz$' "registry_${MCP_PUBLISHER_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Validate
        run: ./mcp-publisher validate

      - name: Login via DNS (domain namespace)
        env:
          MCP_DNS_PRIVATE_KEY_HEX: ${{ secrets.MCP_DNS_PRIVATE_KEY_HEX }}
        run: |
          if [ -z "$MCP_DNS_PRIVATE_KEY_HEX" ]; then
            echo "::error::MCP_DNS_PRIVATE_KEY_HEX secret is empty — set it to the hex ed25519 private key for _mcp.uteke.app" >&2
            exit 1
          fi
          ./mcp-publisher login dns -domain uteke.app -private-key "$MCP_DNS_PRIVATE_KEY_HEX"

      - name: Publish
        run: ./mcp-publisher publish
