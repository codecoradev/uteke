name: Deploy Website to Cloudflare Pages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      # @codecora/theme is a github: dependency on a private repo, and the
      # job's own GITHUB_TOKEN cannot read another repository. THEME_READ_TOKEN
      # is a fine-grained token with read access to contents of
      # codecoradev/codecora-theme. Fail loudly when it is missing instead of
      # letting bun answer with a bare 404 (#1776).
      - name: Install dependencies
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::Secret THEME_READ_TOKEN is empty or missing. bun cannot fetch the private @codecora/theme dependency (codecoradev/codecora-theme) without it."
            exit 1
          fi
          bun install --frozen-lockfile
        working-directory: docs
        env:
          # bun sends GITHUB_TOKEN to api.github.com for github: dependencies.
          GITHUB_TOKEN: ${{ secrets.THEME_READ_TOKEN }}

      - name: Build
        run: bun run build
        working-directory: docs

      - name: Verify build output
        run: |
          if [ ! -d "docs/.vitepress/dist" ] || [ -z "$(ls -A docs/.vitepress/dist)" ]; then
            echo "::error::Build output is empty or missing."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create uteke --production-branch=main || true
          command: pages deploy docs/.vitepress/dist/ --project-name=uteke --commit-dirty=true 
