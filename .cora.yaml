# Cora Code Review Configuration
# See: https://github.com/codecoradev/cora-cli

# Provider settings — use global config (~/.cora/config.yaml)
# provider:
#   provider: freemodel
#   model: gpt-5.4
#   base_url: https://api.freemodel.dev/v1

# Review focus areas: security, performance, bugs, best-practice, style
focus:
  - security
  - performance
  - bugs

# Custom rules / additional instructions for the reviewer
rules:
  - "Control-flow guardrail (cora-code#523): before claiming a code path is unreachable, a call is missing on a branch, or a branch skips a validation, you MUST verify the branch structure against the surrounding function body — not only the unified-diff context lines. Shared `match` arms, `.map()` producers feeding a single arm, and early-return patterns frequently make two call paths converge on the same code. If the diff context alone does not show the enclosing control flow, do not assert reachability claims — report only what is visible in the evidence."
  - "All SQL queries use parameterized/bound statements via rusqlite. CLI args are struct fields passed to uteke-core which uses param() bindings, never string interpolation. Do not flag SQL injection on CLI struct definitions."
  - "Fields, struct members, and CLI flags named `api_key` / `extract_api_key` (e.g. in cli.rs Import args, ExtractOpts, Extractor, ExtractionConfig) are identifiers and runtime-populated values resolved from env vars, config files, or CLI input. They are never hardcoded secrets. Do not flag 'hardcoded password or secret' on these declarations or assignments; this mirrors the existing `embed/openai.rs` api_key field."
  - "The `__init__.py.tmpl` template uses `subprocess.run(cmd)` where `cmd` is always constructed as `[self._bin] + args` with `self._bin` pointing to the uteke binary path and `args` being hardcoded string literals (e.g. `['recall', query, ...]`). This is a controlled subprocess invocation pattern, not command injection. Do not flag 'command injection' on subprocess calls in this file."

# Ignore patterns
ignore:
  files:
    - "*.lock"
    - "package-lock.json"
    - "yarn.lock"
    - "vendor/"
    - "node_modules/"
    # Test vectors of the privacy filter (#1464): inputs are secret-shaped on
    # purpose (split into fragments, never a real credential).
    - "docs/privacy-filter-cases.json"
  rules:
    - "Hardcoded password or secret"
    - "Command injection via exec/system with dynamic input"

# Hook settings
hook:
  mode: warn          # "warn" (print but allow) or "block" (fail commit)
  min_severity: major # minimum severity to trigger hook action
  max_diff_size: 5242880 # max 5MB diff chars before refusing

# Output settings
output:
  format: pretty      # pretty, json, compact, sarif
  color: true
