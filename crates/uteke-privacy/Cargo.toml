[package]
name = "uteke-privacy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Secret detector and redactor shared by uteke and tole: AWS, GitHub, npm, Slack, Google keys, bearer, JWT, URL passwords and NAME=value secrets, masked in a shape-preserving way"
readme = "README.md"
keywords = ["secrets", "redaction", "privacy", "security", "scanner"]
categories = ["text-processing", "development-tools"]
documentation = "https://docs.rs/uteke-privacy"
homepage = "https://github.com/codecoradev/uteke"

[features]
# Serialize/Deserialize for `RedactionCount`. Off by default: the crate then
# depends on `regex` only. uteke-core turns it on for its JSON responses.
serde = ["dep:serde"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
