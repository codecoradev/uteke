[package]
name = "uteke-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTTP server for uteke — persistent warm memory for AI agents"
keywords = ["server", "memory", "ai", "http", "embedding"]
categories = ["web-programming::http-server", "development-tools"]

[features]
# Dual-engine default (#1168): ship BOTH engines, runtime-selectable via
# UTEKE_VECTOR_BACKEND / [vector] backend. Slim builds: --no-default-features
# --features vecq (mobile, pure Rust) or --features usearch (classic).
default = ["usearch", "vecq"]
docgen = ["dep:schemars"]
usearch = ["uteke-core/usearch", "uteke-mcp/usearch"]
vecq = ["uteke-core/vecq", "uteke-mcp/vecq"]

[lib]
name = "uteke_server"
path = "src/lib.rs"

[[bin]]
name = "uteke-serve"
path = "src/main.rs"

[dependencies]
uteke-core = { path = "../uteke-core", version = "0.18.0", default-features = false, features = ["onnx"] }
uteke-mcp = { path = "../uteke-mcp", version = "0.18.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }
toml = "1"
tiny_http = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3.1", features = ["env-filter"] }
ctrlc = "3"
uuid = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
