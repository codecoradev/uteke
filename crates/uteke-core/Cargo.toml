[package]
name = "uteke-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
rust-version.workspace = true
keywords = ["memory", "ai", "embedding", "vector-search", "semantic"]
categories = ["science", "data-structures"]
readme = "../../README.md"

[features]
# Dual-engine default (#1168): official binaries ship BOTH engines so
# UTEKE_VECTOR_BACKEND / [vector] backend can switch at runtime.
# Slim builds: --no-default-features --features "onnx,vecq" (mobile, no C++)
# or --features "onnx,usearch" (classic single-engine desktop).
default = ["onnx", "usearch", "vecq"]
onnx = ["dep:ort", "dep:ndarray", "dep:tokenizers"]
# Default vector search backend (HNSW, C++ FFI).
usearch = ["dep:usearch"]
# Alternative pure-Rust vector search backend (training-free 4-bit quantization).
# Mutually exclusive with `usearch` — enabling both is a compile error
# (see src/memory/vector.rs). Build with:
#   cargo build -p uteke-core --no-default-features --features "onnx,vecq"
vecq = ["dep:vecq-core"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
usearch = { version = "2", optional = true }
vecq-core = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "2"
dirs = "7"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
fs2 = "0.4"
# ONNX-only dependencies (gated behind `onnx` feature)
# NOTE: load-dynamic requires api-18+ to avoid pykeio/ort#547 (vitis EP compile error).
# download-binaries is intentionally removed — ORT lib is shipped as a sidecar instead.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "api-18"], optional = true }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.23", optional = true }
# Non-optional: the embedding cache (all backends, incl. OpenAI/Ollama)
# hashes keys with SHA256 — needed in every feature profile (#1131).
sha2 = { version = "0.11" }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
