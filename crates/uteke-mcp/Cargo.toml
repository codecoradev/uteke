[package]
name = "uteke-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP server for uteke — expose persistent memory to AI coding agents"
readme = "README.md"
keywords = ["mcp", "ai", "memory", "embedding", "agents"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/uteke-mcp"
homepage = "https://github.com/codecoradev/uteke"

[[bin]]
name = "uteke-mcp"
path = "src/main.rs"

[lib]
name = "uteke_mcp"
path = "src/lib.rs"

[features]
# Dual-engine default (#1168): ship BOTH engines, runtime-selectable via
# UTEKE_VECTOR_BACKEND / [vector] backend. Slim builds: --no-default-features
# --features vecq (mobile, pure Rust) or --features usearch (classic).
default = ["usearch", "vecq"]
usearch = ["uteke-core/usearch"]
vecq = ["uteke-core/vecq"]

[dependencies]
uteke-core = { path = "../uteke-core", version = "0.17.0", default-features = false, features = ["onnx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
