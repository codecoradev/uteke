[package]
name = "uteke-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI for Uteke: long-term memory for AI agents (Claude Code, Cursor, Codex, any MCP client), one offline binary"
keywords = ["cli", "memory", "ai-agents", "mcp", "offline"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "uteke"
path = "src/main.rs"

[features]
# Dual-engine default (#1168): ship BOTH engines, runtime-selectable via
# UTEKE_VECTOR_BACKEND / [vector] backend. Slim builds: --no-default-features
# --features vecq (mobile, pure Rust) or --features usearch (classic).
default = ["usearch", "vecq"]
usearch = ["uteke-core/usearch"]
vecq = ["uteke-core/vecq"]

[dependencies]
uteke-core = { path = "../uteke-core", version = "0.23.0", default-features = false, features = ["onnx"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.1", features = ["env-filter"] }
dirs = "7"
toml = "1"
serde = { version = "1", features = ["derive"] }
clap_complete = "4"
ctrlc = "3"
tracing-appender = "0.2"
which = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
urlencoding = "2.1.3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
tempfile = "3"
x509-parser = "0.18"
ring = "0.17"
base64 = "0.23"

[dev-dependencies]
uteke-core = { path = "../uteke-core", features = ["test-support"] }
rcgen = "0.14"
serial_test = "3"
yaml-rust2 = "0.13.0"

[lints]
workspace = true
